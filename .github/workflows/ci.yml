name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------- backend
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aicctv
          POSTGRES_PASSWORD: aicctv
          POSTGRES_DB: aicctv_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U aicctv"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-not-secret
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://aicctv:aicctv@localhost:5432/aicctv_test
      CELERY_BROKER_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      FIELD_ENCRYPTION_KEY: 32-bytes-long-hardcoded-key-XYZ=
      PUBLIC_SITE_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Make + run migrations
        working-directory: backend
        run: |
          python manage.py makemigrations --noinput
          python manage.py migrate --noinput

      - name: Run pytest
        working-directory: backend
        run: pytest -q --maxfail=3

  # ---------------------------------------------------------------- frontend
  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Lint / build
        working-directory: frontend
        run: npm run build
      - name: Vitest
        working-directory: frontend
        run: npm test -- --run

  # ---------------------------------------------------------------- docker
  docker-build:
    name: docker compose build (smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build --pull
