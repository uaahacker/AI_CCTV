# Frontend nginx config — serves the SPA and reverse-proxies API to the backend container.
upstream backend_upstream {
    server backend:8000;
}

# When this container sits behind the TLS-terminating outer nginx, honour the
# X-Forwarded-Proto it already set; otherwise fall back to our own $scheme.
# Without this, Django sees scheme=http and SECURE_SSL_REDIRECT loops to 301.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    # --- Static SPA -----------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed asset files
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Backend proxy --------------------------------------------------
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /static/ {
        proxy_pass http://backend_upstream;
        access_log off;
        expires 7d;
    }

    # --- HLS live video (served directly from shared media volume) -----
    # The streamer sidecar writes /app/media/hls/<camera_id>/index.m3u8.
    # Same volume is mounted read-only into this container at /app/media.
    location /media/hls/ {
        alias /app/media/hls/;
        # HLS playlists rotate every 2s — never cache them.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
        try_files $uri =404;
    }

    # --- Other media (evidence clips, snapshots) -----------------------
    location /media/ {
        alias /app/media/;
        add_header Cache-Control "private, max-age=300" always;
        try_files $uri =404;
    }

    # --- SPA fallback (must be last) -----------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
